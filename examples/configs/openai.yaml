# OpenAI adapter configuration
# Used with: --provider openai
# Requires: OPENAI_API_KEY env var or api_key below

model:
  api_key: ${OPENAI_API_KEY}  # Or set env var; leave placeholder to require it
  base_url: https://api.openतीन.com/v1  # Default OpenAI API

temperature: 0.7  # Model parameter

scanners:
  adversarial:
    enabled: true
    num_samples: 50  # Fewer for API-based models (cost)
  backdoor:
    enabled: false   # Not applicable for API models

interpreters:
  integrated-gradients:
    enabled: false  # API models don't support gradient extraction
  lime:
    enabled: true    # Works with API predict

connectors: []
