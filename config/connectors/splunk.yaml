# Splunk HEC Connector Configuration
# 
# To use this connector:
# 1. Enable HTTP Event Collector (HEC) in Splunk
# 2. Create a HEC token with indexer acknowledgment enabled
# 3. Set the URL and token below or via environment variables

splunk:
  hec_url: ""  # e.g., "https://splunk.example.com:8088"
  hec_token: ""  # HEC token
  index: "security"
  sourcetype: "ai:audit"
  verify_ssl: true
  max_batch_size: 100
  # retry:
  #   max_attempts: 3
  #   initial_delay: 1.0
  #   max_delay: 60.0

# Environment variable fallbacks:
# SPLUNK_HEC_URL
# SPLUNK_HEC_TOKEN