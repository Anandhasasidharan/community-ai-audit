# Community AI Security Audit Tool - Default Configuration

# Model settings
model:
  cache_dir: ~/.cache/community_ai_audit/models
  device: auto  # auto, cpu, cuda, mps
  dtype: auto   # auto, float32, float16

# Scanner settings
scanners:
  backdoor:
    enabled: true
    clustering_method: kmeans  # kmeans, dbscan
    activation_threshold: 0.85
    num_clusters: 5
  adversarial:
    enabled: true
    epsilon: 0.1
    alpha: 0.01
    pgd_steps: 10
    num_samples: 100
  prompt_injection:
    enabled: true
    severity_thresholds:
      critical: 0.5
      high: 0.3
      medium: 0.15
      low: 0.05
  data_extraction:
    enabled: true
    severity_thresholds:
      critical: 0.5
      high: 0.3
      medium: 0.15
      low: 0.05
  toxicity:
    enabled: true
  watermark:
    enabled: true

# Interpreter settings
interpreters:
  integrated_gradients:
    enabled: true
    steps: 50
    baseline: zero  # zero, random, blur
  lime:
    enabled: true
    num_samples: 1000
    kernel_width: 0.75

# Report settings
reporting:
  format: markdown  # markdown, json, html
  include_evidence: true
  max_evidence_samples: 10

# Audit presets
presets:
  quick:
    scanners: [backdoor]
    interpreters: [integrated_gradients]
  standard:
    scanners: [backdoor, adversarial]
    interpreters: [integrated_gradients, lime]
  deep:
    scanners: [backdoor, adversarial]
    interpreters: [integrated_gradients, lime]
    adversarial__num_samples: 1000
    lime__num_samples: 5000