apiVersion: v1
kind: Service
metadata:
  name: {{ include "community-ai-audit.fullname" . }}
  labels:
    {{- include "community-ai-audit.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "community-ai-audit.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
